<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Davaasren's personal homepage. Explore my projects on GitHub.">
  <meta name="theme-color" content="#f5f3ed">
  <title>Davaasren — Personal homepage</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f3ed; color: #202c29; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; }
    .page { max-width: 1120px; margin: auto; padding: 36px 40px; min-height: 100svh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .logo { font-size: 23px; font-weight: 750; text-decoration: none; letter-spacing: -1px; }
    .nav { font-size: 14px; text-underline-offset: 5px; }
    main { flex: 1; display: grid; grid-template-columns: 1.5fr 1fr; align-items: center; gap: 70px; padding: 90px 0; }
    .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #5d7269; font-weight: 600; }
    h1 { font-size: clamp(48px, 7vw, 88px); font-weight: 650; line-height: 1.08; letter-spacing: -4px; margin: 24px 0; }
    h1 span { color: #637d6c; }
    .intro { max-width: 390px; font-size: 18px; line-height: 1.7; color: #64706a; }
    .button { display: inline-flex; gap: 26px; align-items: center; padding: 17px 24px; border-radius: 8px; background: #263e33; color: white; text-decoration: none; margin-top: 22px; font-size: 14px; font-weight: 600; transition: background .2s; }
    .button:hover { background: #43614f; }
    a:focus-visible { outline: 3px solid #a17d3c; outline-offset: 5px; }
    .art { aspect-ratio: 1; border: 1px solid #d8dfd5; border-radius: 50%; position: relative; display: grid; place-items: center; background: #e9ede3; overflow: hidden; }
    .art::before { content: ""; width: 70%; height: 70%; border: 1px solid #b7c5b2; border-radius: 50%; position: absolute; }
    .art::after { content: ""; width: 43%; height: 43%; border: 1px solid #b7c5b2; border-radius: 50%; position: absolute; }
    .initial { font-family: Georgia, serif; font-size: clamp(100px, 16vw, 190px); color: #49614e; z-index: 1; }
    footer { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid #d8ddd3; padding-top: 22px; font-size: 12px; color: #6e7970; }
    @media (max-width: 650px) { .page { padding: 26px 24px; } main { grid-template-columns: 1fr; gap: 45px; padding: 65px 0; } h1 { letter-spacing: -2.5px; } .art { width: 220px; justify-self: center; } footer { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="page">
    <header><a class="logo" href="./" aria-label="Davaasren home">d.</a><a class="nav" href="https://github.com/Davaasren">GitHub ↗</a></header>
    <main>
      <section aria-labelledby="intro-title">
        <p class="eyebrow">Welcome to my little corner of the web</p>
        <h1 id="intro-title">Hi, I'm<br><span>Davaasren.</span></h1>
        <p class="intro">A space for my projects and ideas.<br>Take a look at what I'm working on.</p>
        <a class="button" href="https://github.com/Davaasren?tab=repositories">Explore my projects <span aria-hidden="true">↗</span></a>
      </section>
      <div class="art" aria-hidden="true"><span class="initial">D</span></div>
    </main>
    <footer><span>© 2026 Davaasren</span><span>Made with curiosity. Hosted on GitHub.</span></footer>
  </div>
</body>
</html>
